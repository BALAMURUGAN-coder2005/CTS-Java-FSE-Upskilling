<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<title>Local Storage</title>

</head>

<body>

<h2>Select Event</h2>

<select id="eventType" onchange="saveevent()">

<option value="">Choose Event</option>

<option>Music Event</option>

<option>Sports Event</option>

<option>Food Festival</option>

</select>

<br><br>

<button onclick="clearprefs()">
Clear Preferences
</button>

<script>

window.onload=function(){

let saved=localStorage.getItem("event");

if(saved){
document.getElementById("eventType").value=saved;
}

}

function saveevent(){

let value=document.getElementById("eventType").value;

localStorage.setItem("event",value);

}

function clearprefs(){

localStorage.clear();
sessionStorage.clear();

alert("Preferences Cleared");

}

</script>

</body>
</html>
