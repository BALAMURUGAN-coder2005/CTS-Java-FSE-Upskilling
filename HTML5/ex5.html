<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<title>Event Registration</title>

<style>

body{
font-family:Arial;
background-color:#f2f2f2;
}

form{
width:350px;
margin:auto;
background-color:white;
padding: 40px;
border-radius:10px;
box-shadow:0px 0px 10px gray;
}

h2{
text-align:center;
}

input,select,textarea{
width:100%;
padding:8px;
margin-top:8px;
margin-bottom:15px;
}

button{
background-color:blue;
color:white;
padding:10px;
border:none;
width:100%;
cursor:pointer;
}

button:hover{
background-color:darkblue;
}

#result{
color:green;
font-weight:bold;
}

</style>

</head>

<body>

<h2>Event Registration Form</h2>

<form onsubmit="showmsg(); return false;">

<label>Name</label>

<input type="text"
placeholder="Enter your name"
required
autofocus>

<label>Email</label>

<input type="email"
placeholder="Enter your email"
required>

<label>Date</label>

<input type="date"
required>

<label>Event Type</label>

<select required>

<option value="">Select Event</option>

<option>Music Event</option>

<option>Sports Event</option>

<option>Food Festival</option>

</select>

<label>Message</label>

<textarea placeholder="Enter message"></textarea>

<button type="submit">
Register
</button>

<br><br>

<output id="result"></output>

</form>

<script>

function showmsg(){

document.getElementById("result").innerHTML=
"Registration Successful";

}

</script>

</body>
</html>
